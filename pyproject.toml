[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-adversarial-prompt-framework"
version = "0.1.0"
description = "Safe modular framework for evaluating adversarial prompts on text-to-image models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
models = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "huggingface_hub",
]
eval = ["sentence-transformers"]
dev = ["pytest", "ruff"]
full = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "sentence-transformers",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["t2i_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
