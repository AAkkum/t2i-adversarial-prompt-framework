model:
  name: diffusers
  model_id: stabilityai/stable-diffusion-3.5-large
  width: 1024
  height: 1024
  num_inference_steps: 28
  guidance_scale: 3.5
  dtype: bfloat16

attack:
  name: pgj
  llm_backend: NousResearch/Hermes-3-Llama-3.1-8B
  llm_device: cuda:1
  cache_path: outputs/cache/llm_cache.json
  max_new_tokens: 200
  temperature: 0.7
