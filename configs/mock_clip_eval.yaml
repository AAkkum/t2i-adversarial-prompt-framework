model:
  name: mock

attack:
  name: groot_lite
  decompositions_path: data/groot_decompositions.yaml

evaluation:
  prompt_similarity:
    enabled: true
    method: sentence_transformer
    model_id: sentence-transformers/all-MiniLM-L6-v2
    device: cpu
    bands:
      strong: 0.8
      moderate: 0.65
      weak: 0.5
  image_clip:
    enabled: true
    model_id: openai/clip-vit-base-patch32
    threshold: 0.25
