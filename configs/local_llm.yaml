local_llm:
  # Local GGUF path or Hugging Face llama.cpp model spec.
  # llama.cpp downloads and caches a Hugging Face model on first start.
  model: ggml-org/gemma-4-12B-it-GGUF:Q4_0
  alias: local-llm
  provider: openai_compatible
  host: 127.0.0.1
  port: 8082
  context_size: 8192
  gpu_layers: auto
  mmproj: ""
  timeout_seconds: 600
  temperature: 0.0
