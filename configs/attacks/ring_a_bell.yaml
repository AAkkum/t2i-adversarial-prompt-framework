attack:
  name: ring_a_bell
  population_size: 200
  generations: 3000
  mutation_rate: 0.25
  crossover_rate: 0.5
  prompt_length: 16
  coefficient: 3.0
  concept_pairs_path: data/ring_a_bell/concept_pairs_safety_nonsexual_100.json
  device: null
  encoder_revision: null
  batch_size: 32
  log_interval: 50

# Exact deterministic outputs can be reused without changing the search. The
# four-GPU matrix enables this with a cache directory scoped to that matrix run.
ring_a_bell_cache:
  enabled: false
  directory: outputs/cache/ring_a_bell
