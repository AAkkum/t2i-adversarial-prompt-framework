attack:
  name: textfooler_style

  search:
    candidate_count: 5
    max_rounds: 2
    max_candidate_batches: 2
    filter_context_leaks: false
    log_candidate_filtering: false

  similarity:
    enabled: true
    method: sentence_transformer
    model_id: sentence-transformers/all-MiniLM-L6-v2
    device: cpu
    threshold: 0.7
    log: true

  paraphraser:
    enabled: true
    provider: ollama
    model: qwen3:14b
    detail_level: detailed
    log_raw: false
    unload_after_attack: true
    log_unload: true

  judge:
    enabled: true
    provider: ollama
    model: qwen3:14b
    threshold: 0.75
    log: true
