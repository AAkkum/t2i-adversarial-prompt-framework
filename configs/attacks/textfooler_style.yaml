attack:
  name: textfooler_style

  search:
    candidate_count: 5
    max_rounds: 2
    max_candidate_batches: 2
    filter_context_leaks: false
    log_candidate_filtering: true

  similarity:
    enabled: true
    method: clip_text
    model_id: openai/clip-vit-base-patch32
    device: null
    threshold: 0.7
    log: true

  paraphraser:
    enabled: true
    provider: ollama
    model: qwen3:14B
    device: cuda:0
    dtype: bfloat16
    max_new_tokens: 512
    detail_level: detailed
    log_raw: false
    unload_after_attack: false
    log_unload: true

  judge:
    enabled: true
    provider: ollama
    model: qwen3:14B
    device: cuda:0
    dtype: bfloat16
    max_new_tokens: 128
    threshold: 0.70
    log: true
