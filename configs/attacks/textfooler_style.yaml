attack:
  name: textfooler_style

  search:
    candidate_count: 5
    max_rounds: 2
    max_candidate_batches: 2
    filter_context_leaks: false
    log_candidate_filtering: true

  similarity:
    enabled: true
    method: sentence_transformer
    model_id: sentence-transformers/all-MiniLM-L6-v2
    device: cpu
    threshold: 0.7
    log: true

  paraphraser:
    enabled: true
    detail_level: detailed
    log_raw: false

  judge:
    enabled: true
    threshold: 0.70
    log: true
